name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (offline lane + dev + editable pkg)
        run: |
          pip install -r requirements-precompute.txt -r requirements-api.txt -r requirements-dev.txt -e .
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: ruff check data-pipeline tests
      - name: Tests
        run: python -m pytest
      - name: Pipeline smoke (sandboxed; canonical artifacts are read-only)
        run: python -m fslab.pipeline poly-normal --output "${{ runner.temp }}/frothseg-smoke"
      - name: CONTRACT 2 · manifests <-> artifacts consistent (no drift)
        run: python scripts/check_artifacts.py
      - name: Scientific product development gate
        run: python scripts/check_product_completeness.py --profile development

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Base-integrity guards (the regressions this archetype forbids)
        run: |
          fail=0
          # a real .env must never be tracked (only .env.example)
          if git ls-files | grep -qE '(^|/)\.env(\..+)?$' && ! git ls-files | grep -qx '.env.example'; then
            echo "::error::a real .env is tracked (only .env.example may be)"; fail=1; fi
          # venvs and native binaries must never be tracked
          if git ls-files | grep -qiE '(^|/)\.?venv|\.(dll|so|dylib)$'; then
            echo "::error::a venv or native binary is tracked"; fail=1; fi
          # compact release checkpoints are allowed only in models/ and capped at 25 MiB
          while IFS= read -r artifact; do
            case "$artifact" in
              models/*) ;;
              *) echo "::error::model artifact outside models/: $artifact"; fail=1; continue ;;
            esac
            bytes=$(git cat-file -s "HEAD:$artifact")
            if [ "$bytes" -gt 26214400 ]; then
              echo "::error::model artifact exceeds 25 MiB: $artifact ($bytes bytes)"; fail=1
            fi
          done < <(git ls-files | grep -iE '\.(pt|pth|h5)$' || true)
          # raw/heavy data must never be tracked · commit only compact derived artifacts under data/derived/
          if git ls-files | grep -qiE '\.(parquet|hdf5|nc|mat|npy)$'; then
            echo "::error::raw/heavy data tracked · commit only compact derived artifacts (data/derived/)"; fail=1; fi
          # no leaked local machine paths in tracked sources
          if git grep -nF 'D:\_Repos' -- . ':!.github' >/dev/null 2>&1; then
            echo "::error::leaked local machine path (D:\\_Repos) in a tracked file"; fail=1; fi
          if [ "$fail" -eq 0 ]; then echo "guards: OK"; fi
          exit $fail
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Content standards (no em-dash / emoji in tracked content, ADR-0067)
        run: python scripts/check_content_standards.py
