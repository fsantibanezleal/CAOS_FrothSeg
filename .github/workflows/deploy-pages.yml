name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validation_profile:
        description: "Validation profile (development publishes an explicitly incomplete evidence report)"
        required: true
        default: development
        type: choice
        options:
          - development
          - release

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the committed scientific artifacts
        env:
          VALIDATION_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_profile || 'release' }}
        run: |
          pip install -r requirements-precompute.txt -e .
          python -m fslab.pipeline --check
          python scripts/check_artifacts.py
          python scripts/check_product_completeness.py --profile "$VALIDATION_PROFILE"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the SPA (copy-data.mjs overlays data/derived -> public/)
        run: cd frontend && npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
