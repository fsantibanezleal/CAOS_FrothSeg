<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" class="arch-svg" role="img" aria-label="Where FrothSeg computations execute">
  <style>
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .mono { font-family: var(--font-mono, ui-monospace, Consolas, monospace); }
    .arch-svg .bx { fill: var(--color-surface-2); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .off { stroke: var(--color-magenta); }
    .arch-svg .rep { stroke: var(--color-good); }
    .arch-svg .live { stroke: var(--color-accent); }
    .arch-svg .ttl { fill: var(--color-fg); font-size: 13px; font-weight: 700; }
    .arch-svg .ln { fill: var(--color-fg); font-size: 12px; font-weight: 700; }
    .arch-svg .it { fill: var(--color-fg); font-size: 10.5px; font-weight: 600; }
    .arch-svg .mu { fill: var(--color-fg-subtle); font-size: 10px; }
    .arch-svg .cd { fill: var(--color-accent); font-size: 9.5px; }
    .arch-svg .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="l-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-fg-faint)"/>
    </marker>
  </defs>

  <text class="ttl" x="22" y="30">Where each computation executes</text>
  <text class="mu" x="22" y="48">A method is never moved into the browser merely for presentation.</text>

  <rect class="bx off" x="18" y="72" width="278" height="360" rx="11"/>
  <text class="ln" x="34" y="98">OFFLINE: authoritative science</text>
  <text class="mu" x="34" y="116">CPU/GPU environments, official runtimes</text>
  <rect class="bx" x="34" y="136" width="246" height="70" rx="7"/>
  <text class="it" x="48" y="158">Data + training</text>
  <text class="mu" x="48" y="176">ingest, split, train/resume, calibrate</text>
  <text class="cd mono" x="48" y="194">data-pipeline/fslab/</text>
  <rect class="bx" x="34" y="220" width="246" height="70" rx="7"/>
  <text class="it" x="48" y="242">All 15 methods</text>
  <text class="mu" x="48" y="260">C1-C7, L1-L7, N1 batch inference</text>
  <text class="cd mono" x="48" y="278">models/*/run.json</text>
  <rect class="bx" x="34" y="304" width="246" height="88" rx="7"/>
  <text class="it" x="48" y="326">Full evaluation and export</text>
  <text class="mu" x="48" y="344">960 held-out cells + temporal reports</text>
  <text class="mu" x="48" y="362">runtime, memory, hashes, model sizes</text>
  <text class="cd mono" x="48" y="382">data/derived/</text>

  <rect class="bx rep" x="312" y="72" width="278" height="360" rx="11"/>
  <text class="ln" x="328" y="98">PUBLISHED: versioned evidence</text>
  <text class="mu" x="328" y="116">Read-only bridge from science to web</text>
  <rect class="bx" x="328" y="136" width="246" height="70" rx="7"/>
  <text class="it" x="342" y="158">Validated artifacts only</text>
  <text class="mu" x="342" y="176">schemas, byte sizes, SHA-256, lineage</text>
  <text class="cd mono" x="342" y="194">check_artifacts.py</text>
  <rect class="bx" x="328" y="220" width="246" height="70" rx="7"/>
  <text class="it" x="342" y="242">Offline-only methods stay visible</text>
  <text class="mu" x="342" y="260">15 methods x 13 cases = 195 pairs</text>
  <text class="cd mono" x="342" y="278">showcase/manifest.json</text>
  <rect class="bx" x="328" y="304" width="246" height="88" rx="7"/>
  <text class="it" x="342" y="326">Static deployment</text>
  <text class="mu" x="342" y="344">copies evidence, builds six routes</text>
  <text class="mu" x="342" y="362">never trains or runs canonical inference</text>
  <text class="cd mono" x="342" y="382">copy-data.mjs + Vite</text>

  <rect class="bx live" x="606" y="72" width="278" height="360" rx="11"/>
  <text class="ln" x="622" y="98">BROWSER: image exploration</text>
  <text class="mu" x="622" y="116">Local browser execution, no upload server</text>
  <rect class="bx" x="622" y="136" width="246" height="70" rx="7"/>
  <text class="it" x="636" y="158">Classical implementations matched to Python</text>
  <text class="mu" x="636" y="176">C1 Otsu, C3 H-max, C4 distance</text>
  <text class="cd mono" x="636" y="194">16-condition parity gate</text>
  <rect class="bx" x="622" y="220" width="246" height="70" rx="7"/>
  <text class="it" x="636" y="242">Legacy light model</text>
  <text class="mu" x="636" y="260">SlimSAM loads only after explicit run</text>
  <text class="cd mono" x="636" y="278">WebGPU / WASM fallback</text>
  <rect class="bx" x="622" y="304" width="246" height="88" rx="7"/>
  <text class="it" x="636" y="326">Ten-view workbench</text>
  <text class="mu" x="636" y="344">mask, error, BSD, calibration, temporal</text>
  <text class="mu" x="636" y="362">provenance, export, comparison + more</text>
  <text class="cd mono" x="636" y="382">frontend/src/pages/Tool.tsx</text>

  <path class="flow" d="M296,252 H310" marker-end="url(#l-arrow)"/>
  <path class="flow" d="M590,252 H604" marker-end="url(#l-arrow)"/>
</svg>
