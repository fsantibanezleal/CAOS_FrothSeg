<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" class="arch-svg" role="img" aria-label="FrothSeg source dataset model artifact and release contracts">
  <style>
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .mono { font-family: var(--font-mono, ui-monospace, Consolas, monospace); }
    .arch-svg .bx { fill: var(--color-surface-2); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .hi { stroke: var(--color-accent); }
    .arch-svg .good { stroke: var(--color-good); }
    .arch-svg .warn { stroke: var(--color-warn); }
    .arch-svg .ttl { fill: var(--color-fg); font-size: 13px; font-weight: 700; }
    .arch-svg .it { fill: var(--color-fg); font-size: 10.5px; font-weight: 600; }
    .arch-svg .mu { fill: var(--color-fg-subtle); font-size: 9.8px; }
    .arch-svg .cd { fill: var(--color-accent); font-size: 9.2px; }
    .arch-svg .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="c-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-fg-faint)"/>
    </marker>
  </defs>

  <text class="ttl" x="22" y="30">Contracts prevent silent scientific and web drift</text>
  <text class="mu" x="22" y="48">Each transition has a validated schema, provenance, and failure condition.</text>

  <rect class="bx hi" x="18" y="76" width="196" height="250" rx="10"/>
  <text class="it" x="34" y="100">1. Source + ingestion</text>
  <text class="mu" x="34" y="126">source id, URL, license</text>
  <text class="mu" x="34" y="146">image and annotation format</text>
  <text class="mu" x="34" y="166">geometry group id</text>
  <text class="mu" x="34" y="186">mm_per_px calibration</text>
  <text class="mu" x="34" y="206">reviewer and review state</text>
  <text class="mu" x="34" y="226">archive/content SHA-256</text>
  <text class="cd mono" x="34" y="258">source-registry.json</text>
  <text class="cd mono" x="34" y="278">real-dataset-manifest.json</text>
  <text class="mu" x="34" y="306">Reject missing license or leakage.</text>

  <rect class="bx" x="238" y="76" width="196" height="250" rx="10"/>
  <text class="it" x="254" y="100">2. Dataset + split</text>
  <text class="mu" x="254" y="126">sample id and condition</text>
  <text class="mu" x="254" y="146">latent geometry group</text>
  <text class="mu" x="254" y="166">train/validation/calibration/test</text>
  <text class="mu" x="254" y="186">exact masks, scale, seeds</text>
  <text class="mu" x="254" y="206">cache and manifest hashes</text>
  <text class="cd mono" x="254" y="244">learned-dataset-v2.json</text>
  <text class="cd mono" x="254" y="264">learned-v2-192.npz</text>
  <text class="mu" x="254" y="306">Group overlap is a hard failure.</text>

  <rect class="bx good" x="458" y="76" width="196" height="250" rx="10"/>
  <text class="it" x="474" y="100">3. Model + evidence</text>
  <text class="mu" x="474" y="126">method id and engine version</text>
  <text class="mu" x="474" y="146">source/upstream revisions</text>
  <text class="mu" x="474" y="166">config, seed, device, duration</text>
  <text class="mu" x="474" y="186">checkpoint size and SHA-256</text>
  <text class="mu" x="474" y="206">calibration and 64 case cells</text>
  <text class="mu" x="474" y="226">runtime and peak memory</text>
  <text class="cd mono" x="474" y="258">models/*/run.json</text>
  <text class="cd mono" x="474" y="278">method-benchmark/v2</text>
  <text class="mu" x="474" y="306">Missing cells invalidate comparison.</text>

  <rect class="bx warn" x="678" y="76" width="204" height="250" rx="10"/>
  <text class="it" x="694" y="100">4. Release + web</text>
  <text class="mu" x="694" y="126">all 15 offline method records</text>
  <text class="mu" x="694" y="146">parity and visual QA reports</text>
  <text class="mu" x="694" y="166">temporal evidence</text>
  <text class="mu" x="694" y="186">real held-out thresholds</text>
  <text class="mu" x="694" y="206">version and tag synchronization</text>
  <text class="mu" x="694" y="226">typed frontend mirror</text>
  <text class="cd mono" x="694" y="258">release-report.json</text>
  <text class="cd mono" x="694" y="278">contract.types.ts</text>
  <text class="mu" x="694" y="306">Real held-out evidence is still absent.</text>

  <path class="flow" d="M214,200 H236" marker-end="url(#c-arrow)"/>
  <path class="flow" d="M434,200 H456" marker-end="url(#c-arrow)"/>
  <path class="flow" d="M654,200 H676" marker-end="url(#c-arrow)"/>

  <rect class="bx good" x="18" y="354" width="864" height="80" rx="10"/>
  <text class="it" x="34" y="380">Deployment rule</text>
  <text class="mu" x="34" y="402">The web build copies only validated committed artifacts. It never trains, performs canonical inference, or rewrites results.</text>
  <text class="cd mono" x="34" y="422">check_product_completeness.py + check_artifacts.py + tsc + visual QA</text>
</svg>
