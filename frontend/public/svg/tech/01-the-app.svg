<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" class="arch-svg" role="img" aria-label="FrothSeg full offline product and companion web">
  <style>
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .mono { font-family: var(--font-mono, ui-monospace, Consolas, monospace); }
    .arch-svg .bx { fill: var(--color-surface-2); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .hi { stroke: var(--color-accent); }
    .arch-svg .good { stroke: var(--color-good); }
    .arch-svg .ttl { fill: var(--color-fg); font-size: 13px; font-weight: 700; }
    .arch-svg .it { fill: var(--color-fg); font-size: 11px; font-weight: 600; }
    .arch-svg .mu { fill: var(--color-fg-subtle); font-size: 10px; }
    .arch-svg .cd { fill: var(--color-accent); font-size: 9.5px; }
    .arch-svg .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="p-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-fg-faint)"/>
    </marker>
  </defs>

  <text class="ttl" x="22" y="30">FrothSeg is the complete repository, not only the website</text>
  <text class="mu" x="22" y="48">Data, training, inference, evaluation, temporal analysis, export, documentation, and the companion web ship together.</text>

  <rect class="bx hi" x="20" y="76" width="180" height="142" rx="10"/>
  <text class="it" x="34" y="100">Data and governance</text>
  <text class="mu" x="34" y="122">Synthetic exact geometry</text>
  <text class="mu" x="34" y="140">Licensed real-source import</text>
  <text class="mu" x="34" y="158">Grouped leakage-safe splits</text>
  <text class="mu" x="34" y="176">Calibration and review</text>
  <text class="cd mono" x="34" y="202">manifests/ + data-pipeline/</text>

  <rect class="bx" x="232" y="76" width="190" height="142" rx="10"/>
  <text class="it" x="246" y="100">Complete method ladder</text>
  <text class="mu" x="246" y="122">C1-C7 classical floor</text>
  <text class="mu" x="246" y="140">L1-L7 learned/foundation</text>
  <text class="mu" x="246" y="158">N1 experimental LamellaStar model</text>
  <text class="mu" x="246" y="176">Training, resume, inference</text>
  <text class="cd mono" x="246" y="202">models/ + fslab/learning/</text>

  <rect class="bx good" x="454" y="76" width="190" height="142" rx="10"/>
  <text class="it" x="468" y="100">Auditable evaluation</text>
  <text class="mu" x="468" y="122">15 x 64 = 960 test cells</text>
  <text class="mu" x="468" y="140">Macro + pooled micro metrics</text>
  <text class="mu" x="468" y="158">Runtime, memory, model size</text>
  <text class="mu" x="468" y="176">Temporal IDF1/HOTA/events</text>
  <text class="cd mono" x="468" y="202">method-benchmark/v2</text>

  <rect class="bx good" x="676" y="76" width="190" height="142" rx="10"/>
  <text class="it" x="690" y="100">Versioned outputs</text>
  <text class="mu" x="690" y="122">Run manifests + hashes</text>
  <text class="mu" x="690" y="140">Portable checkpoints/ONNX</text>
  <text class="mu" x="690" y="158">195-pair showcase + docs</text>
  <text class="mu" x="690" y="176">Checked web artifacts</text>
  <text class="cd mono" x="690" y="202">data/derived/ + docs/</text>

  <path class="flow" d="M200,147 H230" marker-end="url(#p-arrow)"/>
  <path class="flow" d="M422,147 H452" marker-end="url(#p-arrow)"/>
  <path class="flow" d="M644,147 H674" marker-end="url(#p-arrow)"/>

  <rect class="bx hi" x="20" y="248" width="414" height="176" rx="10"/>
  <text class="it" x="36" y="274">Authoritative offline product</text>
  <text class="mu" x="36" y="298">Runs data processing, training/fine-tuning, batch inference,</text>
  <text class="mu" x="36" y="316">official foundation runtimes, calibration, full benchmark,</text>
  <text class="mu" x="36" y="334">temporal evaluation, export, and release validation.</text>
  <text class="cd mono" x="36" y="360">python -m fslab.pipeline ... --output &lt;root&gt;</text>
  <text class="cd mono" x="36" y="380">scripts/build_method_benchmark.py --output ...</text>
  <text class="mu" x="36" y="404">The same repository contains every command and implementation.</text>

  <rect class="bx good" x="466" y="248" width="400" height="176" rx="10"/>
  <text class="it" x="482" y="274">Bounded companion website</text>
  <text class="mu" x="482" y="298">Replays selected canonical and held-out evidence without</text>
  <text class="mu" x="482" y="316">retraining or recomputing the benchmark at deployment.</text>
  <text class="mu" x="482" y="340">Validated live: C1, C3, C4 and legacy SlimSAM.</text>
  <text class="mu" x="482" y="358">Replay: all 15 methods x 13 canonical cases.</text>
  <text class="cd mono" x="482" y="384">frontend/ + copy-data.mjs</text>
  <text class="mu" x="482" y="404">Uploads stay local; heavy work exports an offline job command.</text>

  <path class="flow" d="M434,336 H464" marker-end="url(#p-arrow)"/>
</svg>
