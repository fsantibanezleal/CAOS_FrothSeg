<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" class="arch-svg" role="img" aria-label="FrothSeg leakage-safe data training and evaluation flow">
  <style>
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .mono { font-family: var(--font-mono, ui-monospace, Consolas, monospace); }
    .arch-svg .bx { fill: var(--color-surface-2); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .hi { stroke: var(--color-accent); }
    .arch-svg .good { stroke: var(--color-good); }
    .arch-svg .warn { stroke: var(--color-warn); }
    .arch-svg .ttl { fill: var(--color-fg); font-size: 13px; font-weight: 700; }
    .arch-svg .it { fill: var(--color-fg); font-size: 10.5px; font-weight: 600; }
    .arch-svg .mu { fill: var(--color-fg-subtle); font-size: 10px; }
    .arch-svg .cd { fill: var(--color-accent); font-size: 9.5px; }
    .arch-svg .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="d-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-fg-faint)"/>
    </marker>
  </defs>

  <text class="ttl" x="22" y="30">Leakage-safe data to release flow</text>
  <text class="mu" x="22" y="48">Geometry groups split before training; calibration and test remain independent.</text>

  <rect class="bx hi" x="18" y="76" width="152" height="118" rx="10"/>
  <text class="it" x="32" y="100">1. Ingest + validate</text>
  <text class="mu" x="32" y="122">Synthetic exact masks</text>
  <text class="mu" x="32" y="140">Real COCO + license</text>
  <text class="mu" x="32" y="158">Scale + reviewer state</text>
  <text class="cd mono" x="32" y="182">source registry</text>

  <rect class="bx" x="194" y="76" width="152" height="118" rx="10"/>
  <text class="it" x="208" y="100">2. Grouped split</text>
  <text class="mu" x="208" y="122">Latent geometry is unit</text>
  <text class="mu" x="208" y="140">Appearance variants stay</text>
  <text class="mu" x="208" y="158">inside one split only</text>
  <text class="cd mono" x="208" y="182">384 samples, 16 families</text>

  <rect class="bx" x="370" y="76" width="152" height="118" rx="10"/>
  <text class="it" x="384" y="100">3. Train + resume</text>
  <text class="mu" x="384" y="122">Train split only</text>
  <text class="mu" x="384" y="140">Validation monitoring</text>
  <text class="mu" x="384" y="158">GPU/CPU device recorded</text>
  <text class="cd mono" x="384" y="182">checkpoint + run.json</text>

  <rect class="bx warn" x="546" y="76" width="152" height="118" rx="10"/>
  <text class="it" x="560" y="100">4. Calibrate</text>
  <text class="mu" x="560" y="122">Thresholds fixed here</text>
  <text class="mu" x="560" y="140">Brier/ECE measured</text>
  <text class="mu" x="560" y="158">No test access</text>
  <text class="cd mono" x="560" y="182">64 calibration samples</text>

  <rect class="bx good" x="722" y="76" width="160" height="118" rx="10"/>
  <text class="it" x="736" y="100">5. Untouched test</text>
  <text class="mu" x="736" y="122">Run once after lock</text>
  <text class="mu" x="736" y="140">64 samples, 16 conditions</text>
  <text class="mu" x="736" y="158">15 methods, 960 cells</text>
  <text class="cd mono" x="736" y="182">macro + micro evidence</text>

  <path class="flow" d="M170,135 H192" marker-end="url(#d-arrow)"/>
  <path class="flow" d="M346,135 H368" marker-end="url(#d-arrow)"/>
  <path class="flow" d="M522,135 H544" marker-end="url(#d-arrow)"/>
  <path class="flow" d="M698,135 H720" marker-end="url(#d-arrow)"/>

  <rect class="bx" x="18" y="232" width="270" height="176" rx="10"/>
  <text class="it" x="34" y="258">Evaluation bundle</text>
  <text class="mu" x="34" y="282">AP@[.50:.95], AP50/AP75, PQ/SQ/RQ</text>
  <text class="mu" x="34" y="302">boundary F, merge/split/miss/spurious</text>
  <text class="mu" x="34" y="322">D10/D32/D50/D90, count, BSD-W1</text>
  <text class="mu" x="34" y="342">runtime, p95, memory, size, hardware</text>
  <text class="mu" x="34" y="362">robustness + temporal IDF1/HOTA/events</text>
  <text class="cd mono" x="34" y="390">method-benchmark.json</text>

  <rect class="bx good" x="316" y="232" width="270" height="176" rx="10"/>
  <text class="it" x="332" y="258">Evidence validation</text>
  <text class="mu" x="332" y="282">Registry, artifacts, parity, docs, QA</text>
  <text class="mu" x="332" y="302">checkpoint hashes and portable paths</text>
  <text class="mu" x="332" y="322">real held-out thresholds are mandatory</text>
  <text class="mu" x="332" y="342">real-data acceptance remains unsatisfied</text>
  <text class="cd mono" x="332" y="370">check_product_completeness.py</text>
  <text class="cd mono" x="332" y="390">build_release_report.py</text>

  <rect class="bx hi" x="614" y="232" width="268" height="176" rx="10"/>
  <text class="it" x="630" y="258">Companion web deployment</text>
  <text class="mu" x="630" y="282">Copies only committed validated artifacts</text>
  <text class="mu" x="630" y="302">Showcase bake: 15 x 13 checked pairs</text>
  <text class="mu" x="630" y="322">Benchmark and canonical replay are read-only</text>
  <text class="mu" x="630" y="342">C1/C3/C4 + SlimSAM are bounded live tools</text>
  <text class="cd mono" x="630" y="370">frontend/dist</text>
  <text class="mu" x="630" y="390">Deployment performs no training or bake.</text>

  <path class="flow" d="M288,320 H314" marker-end="url(#d-arrow)"/>
  <path class="flow" d="M586,320 H612" marker-end="url(#d-arrow)"/>
</svg>
