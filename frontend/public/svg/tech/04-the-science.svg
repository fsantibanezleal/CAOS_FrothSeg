<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" class="arch-svg" role="img" aria-label="FrothSeg complete fifteen-method ladder">
  <style>
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .mono { font-family: var(--font-mono, ui-monospace, Consolas, monospace); }
    .arch-svg .bx { fill: var(--color-surface-2); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .hi { stroke: var(--color-accent); }
    .arch-svg .good { stroke: var(--color-good); }
    .arch-svg .warn { stroke: var(--color-warn); }
    .arch-svg .ttl { fill: var(--color-fg); font-size: 13px; font-weight: 700; }
    .arch-svg .it { fill: var(--color-fg); font-size: 10.5px; font-weight: 600; }
    .arch-svg .mu { fill: var(--color-fg-subtle); font-size: 9.7px; }
    .arch-svg .cd { fill: var(--color-accent); font-size: 9.2px; }
  </style>

  <text class="ttl" x="22" y="30">Complete method ladder: implementation and quality are separate</text>
  <text class="mu" x="22" y="48">All 15 methods run offline. Predictive claims follow the predeclared AP 0.30 comparison threshold.</text>

  <rect class="bx hi" x="18" y="76" width="204" height="236" rx="10"/>
  <text class="it" x="34" y="100">C1-C7: classical</text>
  <text class="mu" x="34" y="124">C1 Otsu + connected components</text>
  <text class="mu" x="34" y="144">C2 immersion watershed</text>
  <text class="mu" x="34" y="164">C3 highlight H-max watershed</text>
  <text class="mu" x="34" y="184">C4 distance-transform watershed</text>
  <text class="mu" x="34" y="204">C5 H-minima watershed</text>
  <text class="mu" x="34" y="224">C6 SLIC + RAG merge</text>
  <text class="mu" x="34" y="244">C7 lamella valley edge</text>
  <text class="cd mono" x="34" y="276">offline: all seven</text>
  <text class="cd mono" x="34" y="294">interactive: C1/C3/C4</text>

  <rect class="bx" x="238" y="76" width="204" height="236" rx="10"/>
  <text class="it" x="254" y="100">L1-L4: domain learned</text>
  <text class="mu" x="254" y="128">L1 boundary U-Net + watershed</text>
  <text class="mu" x="254" y="152">L2 deep-marker watershed</text>
  <text class="mu" x="254" y="176">L3 GC-FSegNet</text>
  <text class="mu" x="254" y="200">L4 StarDist 2D</text>
  <text class="mu" x="254" y="232">Train/resume/infer/export</text>
  <text class="mu" x="254" y="252">checkpoints and calibration</text>
  <text class="cd mono" x="254" y="276">official framework graphs</text>
  <text class="cd mono" x="254" y="294">untouched-test evidence</text>

  <rect class="bx good" x="458" y="76" width="204" height="236" rx="10"/>
  <text class="it" x="474" y="100">L5-L7: foundation/detector</text>
  <text class="mu" x="474" y="128">L5 Cellpose-SAM, fine-tuned</text>
  <text class="mu" x="474" y="152">L6 YOLO froth segmentation</text>
  <text class="mu" x="474" y="176">L7 SAM2.1 image + video</text>
  <text class="mu" x="474" y="208">Official upstream implementations</text>
  <text class="mu" x="474" y="228">and pinned checkpoint lineage</text>
  <text class="cd mono" x="474" y="260">L5 test AP 0.5099</text>
  <text class="cd mono" x="474" y="280">current controlled leader</text>
  <text class="mu" x="474" y="298">No plant-readiness claim.</text>

  <rect class="bx warn" x="678" y="76" width="204" height="236" rx="10"/>
  <text class="it" x="694" y="100">N1: experimental model</text>
  <text class="mu" x="694" y="128">LamellaStar</text>
  <text class="mu" x="694" y="152">center + boundary + distance heads</text>
  <text class="mu" x="694" y="176">checkpoint, inference, ablation, export</text>
  <text class="cd mono" x="694" y="212">test AP 0.2145</text>
  <text class="mu" x="694" y="236">below the AP 0.30 threshold</text>
  <text class="mu" x="694" y="260">measured below the reference</text>
  <text class="mu" x="694" y="284">not presented as an improvement</text>

  <rect class="bx good" x="18" y="338" width="864" height="96" rx="10"/>
  <text class="it" x="34" y="364">One comparison contract for every row</text>
  <text class="mu" x="34" y="386">64 untouched cases x 15 methods = 960 cells, 16 conditions, macro means, pooled micro TP/FP/FN, robustness, calibration, and compute.</text>
  <text class="mu" x="34" y="406">Canonical cases remain a separate failure-analysis surface. Real held-out acceptance remains mandatory for release.</text>
  <text class="cd mono" x="34" y="424">data/derived/method-benchmark.json</text>
</svg>
